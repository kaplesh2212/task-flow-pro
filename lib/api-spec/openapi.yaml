openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TaskFlow Pro API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task management
  - name: habits
    description: Habit tracking
  - name: reminders
    description: Reminder system
  - name: dashboard
    description: Dashboard analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, all]
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /tasks/{id}/toggle:
    post:
      operationId: toggleTask
      tags: [tasks]
      summary: Toggle task completion status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits with today's completion status
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHabitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit with full history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Habit detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitDetail"
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHabitInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /habits/{id}/check-in:
    post:
      operationId: checkInHabit
      tags: [habits]
      summary: Toggle today's habit completion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List upcoming reminders
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      tags: [reminders]
      summary: Create a reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /reminders/{id}:
    delete:
      operationId: deleteReminder
      tags: [reminders]
      summary: Delete a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateReminder
      tags: [reminders]
      summary: Update a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReminderInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get today's productivity overview
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/weekly:
    get:
      operationId: getWeeklyReport
      tags: [dashboard]
      summary: Get last 7 days completion data
      responses:
        "200":
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
        createdAt:
          type: string
        completedAt:
          type: string
          nullable: true
      required: [id, title, category, priority, status, createdAt]

    CreateTaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          nullable: true
      required: [title, category, priority]

    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]

    Habit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
        color:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        streak:
          type: integer
        bestStreak:
          type: integer
        completedToday:
          type: boolean
        createdAt:
          type: string
      required: [id, name, icon, color, frequency, difficulty, streak, bestStreak, completedToday, createdAt]

    HabitDetail:
      allOf:
        - $ref: "#/components/schemas/Habit"
        - type: object
          properties:
            recentLogs:
              type: array
              items:
                $ref: "#/components/schemas/HabitLog"
            completionRate:
              type: number
          required: [recentLogs, completionRate]

    HabitLog:
      type: object
      properties:
        date:
          type: string
        completed:
          type: boolean
      required: [date, completed]

    CreateHabitInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        icon:
          type: string
        color:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required: [name, icon, color, frequency, difficulty]

    UpdateHabitInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
        color:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        difficulty:
          type: string
          enum: [easy, medium, hard]

    Reminder:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        remindAt:
          type: string
        repeat:
          type: string
          enum: [none, daily, weekly]
        linkedTaskId:
          type: string
          nullable: true
        linkedHabitId:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, title, remindAt, repeat, createdAt]

    CreateReminderInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        remindAt:
          type: string
        repeat:
          type: string
          enum: [none, daily, weekly]
        linkedTaskId:
          type: string
          nullable: true
        linkedHabitId:
          type: string
          nullable: true
      required: [title, remindAt, repeat]

    UpdateReminderInput:
      type: object
      properties:
        title:
          type: string
        remindAt:
          type: string
        repeat:
          type: string
          enum: [none, daily, weekly]

    DashboardSummary:
      type: object
      properties:
        productivityScore:
          type: integer
        tasksTotal:
          type: integer
        tasksCompleted:
          type: integer
        tasksPending:
          type: integer
        tasksOverdue:
          type: integer
        habitsTotal:
          type: integer
        habitsCompletedToday:
          type: integer
        longestStreak:
          type: integer
        upcomingRemindersCount:
          type: integer
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - productivityScore
        - tasksTotal
        - tasksCompleted
        - tasksPending
        - tasksOverdue
        - habitsTotal
        - habitsCompletedToday
        - longestStreak
        - upcomingRemindersCount
        - categoryBreakdown

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required: [category, count]

    WeeklyReport:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayStat"
        totalTasksCompleted:
          type: integer
        totalHabitsCompleted:
          type: integer
        averageScore:
          type: integer
      required: [days, totalTasksCompleted, totalHabitsCompleted, averageScore]

    DayStat:
      type: object
      properties:
        date:
          type: string
        label:
          type: string
        tasksCompleted:
          type: integer
        habitsCompleted:
          type: integer
        score:
          type: integer
      required: [date, label, tasksCompleted, habitsCompleted, score]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [task_completed, task_created, habit_completed, habit_created, reminder_created]
        title:
          type: string
        timestamp:
          type: string
      required: [id, type, title, timestamp]
